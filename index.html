<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Days Cycling Company — Our new website is coming soon. Visit us in Mossel Bay.">
  <title>Days Cycling Company — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #FF6B00;
      --white: #ffffff;
      --dark: #0a0a0a;
      --muted: rgba(255, 255, 255, 0.55);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--white);
      background: var(--dark);
      overflow: hidden;
    }

    /* ── BACKGROUND ── */
    /* Upload team-photo.jpeg to the repo root to enable the team background photo */
    .bg {
      position: fixed;
      inset: 0;
      background: var(--dark) url('team-photo.jpeg') center 25% / cover no-repeat;
      animation: kenburns 26s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes kenburns {
      from { transform: scale(1) translate(0, 0); }
      to   { transform: scale(1.08) translate(-1.5%, -0.5%); }
    }

    /* ── OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.97) 0%,
        rgba(0, 0, 0, 0.74) 22%,
        rgba(0, 0, 0, 0.40) 55%,
        rgba(0, 0, 0, 0.68) 100%
      );
      z-index: 1;
    }

    /* ── MAIN CONTENT ── */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 3rem 1.5rem 5.5rem;
      text-align: center;
    }

    /* ── LOGO ── */
    .logo {
      width: 158px;
      height: 158px;
      object-fit: cover;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.88);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 8px 48px rgba(0, 0, 0, 0.65),
        0 0 70px rgba(255, 255, 255, 0.05);
      margin-bottom: 1.9rem;
      opacity: 0;
      transform: translateY(-18px);
      transition: opacity 1s ease, transform 1s ease;
      transition-delay: 0.15s;
    }

    /* ── HEADLINE ── */
    .headline {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(62px, 14.5vw, 134px);
      letter-spacing: 0.07em;
      line-height: 1;
      margin-bottom: 0.85rem;
      background: linear-gradient(162deg, #ffffff 0%, #ababab 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 1s ease, transform 1s ease;
      transition-delay: 0.45s;
    }

    /* ── SUBTEXT ── */
    .subtext {
      font-size: clamp(10.5px, 2vw, 14.5px);
      font-weight: 300;
      letter-spacing: 0.24em;
      color: var(--muted);
      text-transform: uppercase;
      max-width: 420px;
      margin-bottom: 2.5rem;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 1s ease, transform 1s ease;
      transition-delay: 0.72s;
    }

    /* ── CHAIN-LINK DIVIDER ── */
    .chain {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2.8rem;
      opacity: 0;
      transition: opacity 0.8s ease;
      transition-delay: 0.95s;
    }

    .chain .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      flex-shrink: 0;
    }

    .chain .link {
      width: 11px;
      height: 3px;
      background: rgba(255, 107, 0, 0.4);
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── SOCIAL / PARTNER LINKS ── */
    .social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      margin-bottom: 2.8rem;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease;
      transition-delay: 1.1s;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: border-color 0.25s ease, color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255, 107, 0, 0.28);
    }

    .trek-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: 48px;
      padding: 0 1.15rem;
      border-radius: 6px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: border-color 0.25s ease, color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .trek-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(255, 107, 0, 0.28);
    }

    /* ── CONTACT ── */
    .contact {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease;
      transition-delay: 1.3s;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: clamp(12px, 1.8vw, 13.5px);
      color: var(--muted);
    }

    .contact-row svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--accent);
    }

    .contact-row a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact-row a:hover { color: var(--white); }

    .hours {
      font-size: clamp(10px, 1.5vw, 11.5px);
      letter-spacing: 0.07em;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 0.15rem;
      line-height: 1.7;
    }

    /* ── FOOTER ── */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.1rem;
      text-align: center;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.2);
      z-index: 10;
    }

    /* ── LOADED: trigger all fade-ins ── */
    body.loaded .logo,
    body.loaded .headline,
    body.loaded .subtext,
    body.loaded .chain,
    body.loaded .social,
    body.loaded .contact {
      opacity: 1;
      transform: none;
    }

    /* ── MOBILE ── */
    @media (max-width: 500px) {
      .logo { width: 118px; height: 118px; margin-bottom: 1.5rem; }
      .subtext { letter-spacing: 0.14em; margin-bottom: 2rem; }
      .chain { margin-bottom: 2rem; }
      .social { gap: 0.85rem; margin-bottom: 2rem; }
      .icon-btn { width: 44px; height: 44px; }
      .trek-btn { height: 44px; font-size: 10px; padding: 0 0.9rem; }
    }

    @media (max-width: 360px) {
      .social { gap: 0.65rem; }
      .trek-btn span { display: none; }
      .trek-btn { width: 44px; padding: 0; border-radius: 50%; justify-content: center; }
    }
  </style>
</head>
<body>

  <script>
